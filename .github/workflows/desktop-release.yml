name: Desktop release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag (new tag only; suffixes create prereleases)
        required: true
        default: v0.1.0
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win-x64
            runner: windows-2022
            python_arch: x64
            requirements: requirements-desktop.txt
            script: scripts/build_desktop.py
          - platform: mac-arm64
            runner: macos-15
            python_arch: arm64
            requirements: requirements-desktop-macos.txt
            script: scripts/build_macos.py
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          architecture: ${{ matrix.python_arch }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install build dependencies
        run: |
          python -m pip install -r ${{ matrix.requirements }}
          npm install --global pnpm@11.0.0
      - name: Install Windows capture without a second OpenCV package
        if: runner.os == 'Windows'
        run: python -m pip install --no-deps -r requirements-desktop-windows.txt
      - name: Verify native architecture
        run: |
          python -c "import platform; print(platform.platform(), platform.machine())"
          node -p "process.platform + '/' + process.arch"
      - name: Test core rules and packaging inputs
        run: >-
          python -m unittest tests.test_lookout_visibility tests.test_opening_technology
          tests.test_ending_prediction tests.test_node_prediction_beta tests.test_desktop
          tests.test_macos_packaging tests.test_release_publication
          tests.test_scoring_profile tests.test_snapshot_scoring
          tests.test_arkrog_comparison tests.test_team_power tests.test_combat_bonuses
          tests.test_relic_presentation tests.test_relic_effect_model tests.test_manual_map
          tests.test_route_planner tests.test_route_allocation tests.test_one_step_advice
          tests.test_scoring_calibration.CalibrationMathTests tests.test_app_icon
      - name: Test frontend
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend test
      - name: Build and verify offline desktop package
        run: python ${{ matrix.script }}
      - name: Upload release packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CelestialFulcrum-${{ matrix.platform }}
          path: |
            dist/CelestialFulcrum-*-${{ matrix.platform }}.zip
            dist/CelestialFulcrum-*-${{ matrix.platform }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ matrix.platform }}
          path: |
            build/desktop-self-test.json
            build/desktop-window-test.json
            build/desktop-window-test-data/logs/desktop.log
            work/macos-self-test.json
            build/pyinstaller/**/warn-*.txt
            build/pyinstaller/**/xref-*.html
            build/pyinstaller-macos/**/warn-*.txt
            build/pyinstaller-macos/**/xref-*.html
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: CelestialFulcrum-*
          path: packages
          merge-multiple: true
      - name: Verify checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_REVISION: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || { echo 'Invalid release tag'; exit 1; }
          cd packages
          sha256sum --check ./*.zip.sha256
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; choose a new tag.'
            exit 1
          fi
          release_flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_flags+=(--prerelease)
          else
            release_flags+=(--latest)
          fi
          gh release create "$RELEASE_TAG" ./*.zip ./*.zip.sha256 \
            --target "$SOURCE_REVISION" "${release_flags[@]}" \
            --title "Celestial Fulcrum $RELEASE_TAG" \
            --notes "Windows x64 / macOS Apple Silicon arm64。包含地图识别与手动建图、节点预测与路径规划、藏品加成汇总与附魔、对局导入导出及地图更新撤销重做。两个平台均通过离线识图和素材完整性自检，Windows 另通过 WebView2 窗口启动验证。主程序采用 sitting-dog 图标。Windows 包未签名；确认来源可信后，若系统阻止运行，请先在下载的 ZIP 属性中解除锁定再完整解压。Mac 包为本机临时签名、未公证。数据目录为 CFARA，旧版存档需手动导入。源码提交：$SOURCE_REVISION。"
